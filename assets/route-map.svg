<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 950" role="img" aria-labelledby="title desc">
<title id="title">Five-night Sydney to Kosciuszko route schematic</title><desc id="desc">24–29 December 2026. Two nights in Canberra and three nights in Jindabyne. Route via Goulburn and Cooma, Mount Ainslie visit on 26 December, mountain outings to Thredbo and Charlotte Pass, then return to Sydney via Cooma and Canberra. Schematic, not to scale. Driving times exclude stops.</desc>
